server:
    address: 0.0.0.0
    port: 8443
    ssl:
        key-store: classpath:keystore.p12
        key-store-type: PKCS12
spring:
    application:
        name: ipt-bank
    config:
        import: file:./src/main/resources/application-sensitive.yaml
    datasource:
        url: jdbc:postgresql://localhost:5432/ipt_bank
    jpa:
        hibernate:
            ddl-auto: update
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: https://your-identity-provider.com/realms/your-realm
    web:
        error:
            include-message: always
